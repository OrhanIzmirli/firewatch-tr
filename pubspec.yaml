name: firewatch_tr
description: "A wildfire tracking mobile app for Turkey."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.8.0
  flutter_animate: ^4.5.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  fl_chart: ^0.69.2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  lottie: ^3.1.3
  shared_preferences: ^2.5.5
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  csv: ^6.0.0
  flutter_map_marker_cluster: ^8.2.2
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  http: ^1.6.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^9.0.1
  workmanager: ^0.6.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/forest-fire.jpg
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#20222E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"